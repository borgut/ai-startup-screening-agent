<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memo · Startup Scouting</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="theme-poster">
  <main class="wrap">
    <div class="memo-topbar"><a class="back-link" href="/" data-i18n="volver_inicio">&larr; Volver al inicio</a>
      <div class="memo-actions"><a id="ic-link" class="ic-link" href="#">Memo IC &rarr;</a>
      <div class="lang-switch"><button class="lang-btn" data-lang="es">ES</button><span class="lang-sep">/</span><button class="lang-btn" data-lang="en">EN</button></div></div></div>
    <section id="memo-container"><p class="muted" style="padding:40px 0;text-align:center" data-i18n="cargando_memo">Cargando memo...</p></section>
  </main>
  <script src="/i18n.js"></script>
  <script src="/render.js"></script>
  <script>
    (() => {
      const tema = new URLSearchParams(location.search).get('tema');
      if (tema) {
        const t = tema.replace(/[^a-z-]/g, '');
        document.body.classList.remove('theme-poster', 'poster-ox', 'theme-ink');
        if (t === 'poster-ox') { document.body.classList.add('theme-poster', 'poster-ox'); }
        else if (t !== 'poster') { document.body.classList.add('theme-' + t); }
        else { document.body.classList.add('theme-poster'); }
      }
    })();
    document.querySelectorAll('.lang-btn').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
    applyI18n();
    (async () => {
      const id = location.pathname.split('/').pop();
      document.getElementById('ic-link').href = '/ic/' + encodeURIComponent(id) + '?lang=' + getLang();
      const container = document.getElementById('memo-container');
      try {
        const res = await fetch('/api/memo/' + id + '?lang=' + getLang());
        const data = await res.json();
        if (!res.ok || !data.memo) {
          container.innerHTML = '<p class="form-note error" style="padding:40px 0">' + (data.error || 'Memo no encontrado') + '</p>';
          return;
        }
        container.innerHTML = window.renderMemoHTML(data.memo);
        if (window.animateGauges) animateGauges(container);
        document.title = 'MEMO: ' + data.memo.nombre + ' · Startup Scouting';
      } catch (err) {
        container.innerHTML = '<p class="form-note error" style="padding:40px 0">Error cargando el memo: ' + (err || '') + '</p>';
      }
    })();
  </script>
</body>
</html>
