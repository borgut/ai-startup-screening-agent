<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memo · AI Startup Screening Agent</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <p style="margin-top:20px"><a href="/">&larr; Volver al inicio</a></p>
    <section id="memo-container"><p class="muted" style="padding:40px 0;text-align:center">Cargando memo...</p></section>
  </main>
  <script src="/render.js"></script>
  <script>
    (async () => {
      const id = location.pathname.split('/').pop();
      const container = document.getElementById('memo-container');
      try {
        const res = await fetch('/api/memo/' + id);
        const data = await res.json();
        if (!res.ok || !data.memo) {
          container.innerHTML = '<p class="form-note error" style="padding:40px 0">' + (data.error || 'Memo no encontrado') + '</p>';
          return;
        }
        container.innerHTML = window.renderMemoHTML(data.memo, { demo: Boolean(data.memo._demo) });
        document.title = 'MEMO: ' + data.memo.nombre + ' · AI Startup Screening Agent';
      } catch (err) {
        container.innerHTML = '<p class="form-note error" style="padding:40px 0">Error cargando el memo: ' + (err || '') + '</p>';
      }
    })();
  </script>
</body>
</html>
