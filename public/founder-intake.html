<!doctype html>
<html lang="es" class="atlas-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Startup Scouting</title>

<style>
:root{--carbon:#e7e0cc;--carbon2:#f5efdf;--bone:#233b34;--dim:#42594b;--faint:#536358;--gold:#2440d6;--hair:rgba(35,59,52,.24);--hairs:#7e8c77}
*{box-sizing:border-box}
body{margin:0;background:var(--carbon);color:var(--bone);font-family:Arial,sans-serif}
.fi-wrap{max-width:760px;margin:auto;padding:30px 44px 90px}
.fi-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--faint)}
.fi-top a{color:var(--dim);text-decoration:none}
.fi-lang button{border:0;background:none;color:var(--faint);font-size:12px;cursor:pointer;padding:0}
.fi-lang button.active{color:var(--bone);text-decoration:underline;text-underline-offset:4px}
.fi-lang span{margin:0 6px}
.fi-stepbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:44px;padding-top:14px;border-top:1px solid var(--gold);color:var(--gold);font-size:11px;letter-spacing:.15em}
.fi-stepbar button{border:1px solid var(--gold);background:transparent;color:var(--bone);padding:9px 14px;font-size:12px;cursor:pointer}
.fi-kicker{color:var(--gold);font-size:11px;letter-spacing:.17em;text-transform:uppercase;margin:70px 0 0}
.fi-kicker em{color:var(--faint);font-style:normal}
h1{font:400 clamp(40px,6vw,68px)/1.02 Georgia,serif;letter-spacing:-.03em;margin:20px 0 18px;max-width:640px;text-wrap:balance}
h1 em{color:var(--gold)}
.fi-sub{color:var(--dim);font-size:16px;line-height:1.6;max-width:560px;margin:0 0 44px}
.fi-opts{display:grid;border-top:1px solid var(--hair)}
.fi-opt{display:flex;align-items:baseline;gap:20px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);color:var(--bone);font:400 20px Georgia,serif;padding:18px 0;cursor:pointer}
.fi-opt .num{color:var(--faint);font:400 11px Arial,sans-serif;letter-spacing:.12em;flex:0 0 26px}
.fi-opt .lbl{min-width:0;overflow-wrap:anywhere}
.fi-opt:hover .num{color:var(--gold)}
.fi-opt.sel{color:var(--gold)}
.fi-opt.sel .num{color:var(--gold)}
.fi-field{margin-bottom:34px}
.fi-field label{display:block;color:var(--faint);font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:12px}
.fi-field input[type=text],.fi-field select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--hairs);color:var(--bone);font:400 20px Georgia,serif;padding:8px 0;outline:none;border-radius:0}
.fi-field select{cursor:pointer}
.fi-field select option{background:var(--carbon2)}
.fi-field .hint{color:var(--faint);font-size:13px;margin-top:10px;line-height:1.5}
.fi-err{color:var(--gold);font-size:13px;min-height:20px;margin:18px 0 0}
.fi-actions{margin-top:26px}
.fi-actions button{background:var(--gold);color:var(--carbon);border:0;padding:16px 26px;font:700 12px Arial;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.fi-sum{display:grid;border-top:1px solid var(--hairs);margin-bottom:60px}
.fi-sum>div{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:14px 0;border-bottom:1px solid var(--hair)}
.fi-sum b{font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.12em;text-transform:uppercase;flex:0 0 130px}
.fi-sum span{color:var(--bone);font:400 16px Georgia,serif;text-align:right;min-width:0;overflow-wrap:anywhere}
.fi-sum button{background:none;border:0;color:var(--gold);font-size:12px;cursor:pointer;padding:0 0 0 10px;flex:0 0 auto}
.fi-next{display:grid;margin-bottom:26px}
.fi-next b{display:block;color:var(--faint);font-weight:400;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.fi-next a{display:flex;align-items:baseline;gap:20px;padding:16px 0;border-bottom:1px solid var(--hair);color:var(--gold);text-decoration:none;font:400 19px Georgia,serif}
.fi-next a:first-of-type{border-top:1px solid var(--hair)}
.fi-next a .num{color:var(--faint);font:400 11px Arial,sans-serif;letter-spacing:.12em;flex:0 0 26px}
.fi-next a:hover .num{color:var(--gold)}
.fi-next a:hover .lbl{text-decoration:underline}
.fi-why{color:var(--dim);font-size:14px;line-height:1.6;margin:0 0 40px;max-width:560px}
.fi-note{color:var(--faint);font-size:13px;line-height:1.7;border-top:1px solid var(--hair);padding-top:22px;max-width:600px}
.fi-save{margin-top:56px;border-top:1px solid var(--gold);padding-top:26px}
.fi-save h3{font:400 24px Georgia,serif;margin:0 0 8px}
.fi-save p{color:var(--dim);font-size:14px;line-height:1.6;margin:0 0 20px;max-width:520px}
.fi-save .fi-savebtns{display:flex;gap:12px;flex-wrap:wrap}
.fi-save button{background:var(--gold);color:var(--carbon);border:0;padding:13px 20px;font:700 12px Arial;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.fi-save button.ghost{background:transparent;border:1px solid var(--gold);color:var(--bone)}
.fi-save small{display:block;color:var(--faint);font-size:12px;margin-top:14px}
.fi-foot{margin-top:60px;border-top:1px solid var(--hair);padding-top:22px;color:var(--faint);font-size:12px;line-height:1.7;max-width:600px}
.fi-foot a{color:var(--dim)}
.fi-restart{display:block;margin:36px auto 0;background:none;border:0;color:var(--faint);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.fi-fade{animation:fifade .35s ease}
@keyframes fifade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:480px){
  .fi-sum>div{display:block;padding:12px 0}
  .fi-sum b{display:inline}
  .fi-sum span{display:block;text-align:left;margin:6px 0 4px}
  .fi-sum button{padding:0}
}
@media(max-width:760px){
  .fi-wrap{padding:22px 20px 60px}
  .fi-kicker{margin-top:52px}
  h1{font-size:44px}
  .fi-opt{font-size:18px}
  .fi-actions button{width:100%}
  .fi-sum b{flex-basis:104px}
  .fi-sum span{font-size:15px}
  .fi-save .fi-savebtns{flex-direction:column}
  .fi-save button{width:100%}
}
</style>
<link rel="stylesheet" href="/site-navigation.css?v=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/painted-atlas.css?v=4"><link rel="stylesheet" href="/art-direction.css?v=2"></head>
<body class="atlas fi-page">
<div class="fi-wrap">
  <div class="fi-top">
    <a href="/raising" id="fi-back">← Volver</a>
    <div class="fi-lang"><button id="fi-es" class="active" type="button">ES</button><span>/</span><button id="fi-en" type="button">EN</button></div>
  </div>
  <div class="fi-stepbar"><span id="fi-step-label"></span><button id="fi-prev" type="button" hidden>← Atrás</button></div>
  <main id="fi-main" class="fi-fade">
    <p class="fi-kicker" id="fi-kicker"></p>
    <h1 id="fi-q"></h1>
    <p class="fi-sub" id="fi-sub"></p>
    <div id="fi-body"></div>
    <p class="fi-err" id="fi-err" role="alert"></p>
    <div class="fi-actions" id="fi-actions"><button id="fi-next" type="button"></button></div>
  </main>
  <div class="fi-foot" id="fi-foot"></div>
</div>
<script src="/founder-intake.js"></script>
<script src="/site-navigation.js?v=1"></script>
<script src="/painted-atlas.js?v=5"></script><script src="/art-direction.js?v=3"></script></body>
</html>
